.m{fill:#5b625e;font-size:10.5px}
.box{fill:#f4f5f2;stroke:#17191a;stroke-width:1.5}
.w{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
</style>
