<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 520" role="img" aria-label="Schematic rev 6: source to LM2596 set to 5 V to TP4056, 18650 on B+ and B-. TP4056 OUT+ and OUT- go to perfboard terminal J1. On the perfboard, BAT+ feeds the AM312 and terminal J2 plus; AM312 OUT charges C1 100 microfarad through D2 1N4148 and R2 1 kilohm, R3 1 megohm discharges it, and the capacitor node drives the gate of Q1 IRLZ44N. Q1 source to GND, drain to J2 minus. J2 feeds a 5 V 2 A boost module, whose output drives two 5 V 3 W COB bars in parallel.">
