<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Half-size breadboard. TP4056 OUT+ and OUT- to the top plus and minus rails. AM312 VCC to plus rail, GND to minus rail, OUT to c3. D2 1N4148 from d3 to d7, stripe at d7. R2 1k from c7 to c11. C1 100 microfarad: plus leg a11, minus leg in the minus rail. R3 1 megohm from b11 to the minus rail. IRLZ44N gate e11, drain e12, source e13, printed side toward you. Jumper c13 to minus rail. LED cathode d12, anode d15. R1 68 ohm from c15 to c19. Jumper a19 to plus rail.">
